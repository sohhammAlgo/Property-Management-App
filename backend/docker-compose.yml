version: '3.9'

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:15-alpine
    container_name: society_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: society_user
      POSTGRES_PASSWORD: society_pass
      POSTGRES_DB: society_management
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U society_user -d society_management']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: society_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: society_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://society_user:society_pass@postgres:5432/society_management
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── FastAPI AI Service ──
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: society_ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./ai-service/.env
    volumes:
      - ./ai-service:/app

volumes:
  postgres_data:
  redis_data:
